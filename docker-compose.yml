services:
  app:
    image: huffmanks/pastebox:${IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
      - data:/app/data
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-file:./data/prod.db}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped

volumes:
  uploads:
  data:
